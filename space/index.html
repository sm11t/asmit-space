<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Space — Sphere Navigation Proof</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    /* minimal fallback styling if you don't want a separate styles.css */
    html,body { height:100%; margin:0; background:#111; color:#ddd; font-family:system-ui,Segoe UI,Roboto; overflow:hidden; }
    #info { position: absolute; left:12px; top:12px; background:rgba(0,0,0,0.45); padding:8px 10px; border-radius:6px; z-index:2; }
    canvas { display:block; width:100%; height:100% }

    /* Loading screen styles */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
      pointer-events: none;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-cube {
      width: 40px;
      height: 40px;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 2s infinite linear;
      margin-bottom: 30px;
    }

    .loading-cube div {
      position: absolute;
      width: 40px;
      height: 40px;
      background: #ffffff;
      border: 2px solid #000000;
      opacity: 0.9;
    }

    .loading-cube .front  { transform: translateZ(20px); }
    .loading-cube .back   { transform: rotateY(180deg) translateZ(20px); }
    .loading-cube .right  { transform: rotateY(90deg) translateZ(20px); }
    .loading-cube .left   { transform: rotateY(-90deg) translateZ(20px); }
    .loading-cube .top    { transform: rotateX(90deg) translateZ(20px); }
    .loading-cube .bottom { transform: rotateX(-90deg) translateZ(20px); }

    @keyframes rotateCube {
      0% { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }

    .loading-text {
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="loading-cube">
      <div class="front"></div>
      <div class="back"></div>
      <div class="right"></div>
      <div class="left"></div>
      <div class="top"></div>
      <div class="bottom"></div>
    </div>
    <div class="loading-text">LOADING SPACE</div>
  </div>

  <div id="info">WASD to move | Middle click + drag to rotate | Scroll to zoom</div>
  <div id="interact-prompt" style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: bold; border: 2px solid rgba(255,255,255,0.3); display: none; z-index: 10;">
    Press <span style="color: #ffcc00; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; margin: 0 4px;">E</span> to interact
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
