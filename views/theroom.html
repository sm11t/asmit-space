<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Room - asmit.space</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/songoverlay.css">
    <style>
        /* Loading overlay */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-bar-container {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar {
            height: 100%;
            background: white;
            width: 0%;
            transition: width 0.3s ease-out;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .loading-text {
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        /* Blur effect for main content */
        #main-content {
            filter: blur(20px);
            opacity: 0;
            transition: filter 1s ease-out, opacity 1s ease-out;
        }

        #main-content.loaded {
            filter: blur(0px);
            opacity: 1;
        }
    </style>
</head>
<body class="theroom">
<!-- Loading Overlay -->
<div id="loading-overlay">
    <div class="loading-text">Loading space...</div>
    <div class="loading-bar-container">
        <div class="loading-bar" id="loading-bar"></div>
    </div>
</div>


<div id="main-content">
    <img src="../assets/asmitspace1.png" id="background-image">
</div>

<div class="change-view-dot" id="monitor-dot" data-url="../views/monitorview.html"></div>
<div class="change-view-dot" id="laptop-dot" data-url="../views/monitorview.html"></div>

<!-- Preloading Script -->
<script>
    const imagesToPreload = [
        '../assets/asmitspace1.png'
        // Add more images here if needed
    ];

    const loadingBar = document.getElementById('loading-bar');
    const loadingOverlay = document.getElementById('loading-overlay');
    const mainContent = document.getElementById('main-content');

    let loadedCount = 0;
    const totalImages = imagesToPreload.length;

    function updateLoadingBar(progress) {
        loadingBar.style.width = progress + '%';
    }

    function preloadImages(imageUrls) {
        return Promise.all(
            imageUrls.map((url, index) => {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        loadedCount++;
                        const progress = (loadedCount / totalImages) * 100;
                        updateLoadingBar(progress);
                        resolve();
                    };
                    img.onerror = () => {
                        loadedCount++;
                        const progress = (loadedCount / totalImages) * 100;
                        updateLoadingBar(progress);
                        reject(new Error(`Failed to load ${url}`));
                    };
                    img.src = url;
                });
            })
        );
    }

    // Start preloading when page loads
    window.addEventListener('DOMContentLoaded', () => {
        preloadImages(imagesToPreload)
            .then(() => {
                // All images loaded, show content with transition
                setTimeout(() => {
                    mainContent.classList.add('loaded');
                    setTimeout(() => {
                        loadingOverlay.classList.add('hidden');
                    }, 500);
                }, 300);
            })
            .catch((error) => {
                console.error('Error loading images:', error);
                // Show content anyway if there's an error
                mainContent.classList.add('loaded');
                loadingOverlay.classList.add('hidden');
            });
    });
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js"></script>
<script src="../js/script.js"></script>
<script src="../js/fullscreen.js"></script>

<!-- Song Overlay -->
<link rel="stylesheet" href="../css/songoverlay.css">
<div id="song-overlay-container"></div>
<script>
    fetch("../common/songoverlay.html")
        .then(res => res.text())
        .then(html => {
            document.getElementById("song-overlay-container").innerHTML = html;
            const script = document.createElement("script");
            script.src = "../js/songoverlay.js";
            document.body.appendChild(script);
        });
</script>

<script>
    window.addEventListener("load", () => {
        if (localStorage.getItem("wantsFullscreen") === "yes") {
            document.documentElement.requestFullscreen().catch((err) => {
                console.warn("Fullscreen request failed:", err);
            });
        }
    });
</script>



</body>
</html>
