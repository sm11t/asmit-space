<link rel="stylesheet" href="linkedin-sim.css">

<header class="linkedin-sim-header">
  <!-- Left side: Logo + Search bar -->
  <div class="linkedin-sim-header-left">
    <!-- Use your existing LinkedIn SVG or an <img> reference -->
    <img
            src="icons/Linkedin.svg"
            alt="LinkedIn Logo"
            class="linkedin-sim-logo"
    >

    <!-- Search bar -->
    <div class="linkedin-sim-search">
      <input type="text" placeholder="Search" />
    </div>
  </div>

  <!-- Right side: Nav icons -->
  <nav class="linkedin-sim-header-right">
    <ul>
      <li>
        <a href="#home">
          <!-- Replace with your own icon or an <img> -->
          <img src="icons/home-svgrepo-com.svg" alt="Home icon">
          <span>Home</span>
        </a>
      </li>
      <li>
        <a href="#mynetwork">
          <img src="icons/group-svgrepo-com.svg" alt="My Network icon">
          <span>My Network</span>
        </a>
      </li>
      <li>
        <a href="#jobs">
          <img src="icons/working-bag-2-svgrepo-com.svg" alt="Jobs icon">
          <span>Jobs</span>
        </a>
      </li>
      <li>
        <a href="#messaging">
          <img src="icons/comment-dots-svgrepo-com.svg" alt="Messaging icon">
          <span>Messaging</span>
        </a>
      </li>
      <li>
        <a href="#notifications">
          <img src="icons/notification-bell-svgrepo-com.svg" alt="Notifications icon">
          <span>Notifications</span>
        </a>
      </li>
      <li>
        <a href="#profile">
          <img src="icons/user-svgrepo-com.svg" alt="Profile" class="profile-pic">
          <span>Me</span>
        </a>
      </li>
    </ul>
  </nav>
</header>
