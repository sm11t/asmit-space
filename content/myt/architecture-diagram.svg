<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <style>
      .bg { fill: #0a0e14; }

      /* Panel styles */
      .panel-primary { fill: #1a1f2e; stroke: #00d4aa; stroke-width: 2.5; }
      .panel-secondary { fill: #151922; stroke: #4a90e2; stroke-width: 2; }
      .panel-tertiary { fill: #1c2128; stroke: #6c5ce7; stroke-width: 2; }
      .panel-muted { fill: #12161d; stroke: #2d3748; stroke-width: 1.5; }
      .panel-future { fill: #141820; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }

      /* Database */
      .db-main { fill: #0f1419; stroke: #00d4aa; stroke-width: 3; }
      .db-highlight { fill: #00d4aa; opacity: 0.1; }

      /* Text styles */
      .title-main { fill: #ffffff; font-family: -apple-system, system-ui, sans-serif; font-size: 36px; font-weight: 700; }
      .title-section { fill: #e2e8f0; font-family: -apple-system, system-ui, sans-serif; font-size: 20px; font-weight: 700; }
      .title-subsection { fill: #cbd5e0; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 600; }
      .text-body { fill: #94a3b8; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 400; }
      .text-small { fill: #64748b; font-family: 'Courier New', monospace; font-size: 12px; }
      .text-code { fill: #8b5cf6; font-family: 'Courier New', monospace; font-size: 13px; }
      .text-accent { fill: #00d4aa; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; font-weight: 600; }
      .text-tag { fill: #00d4aa; font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 700; }

      /* Arrows */
      .arrow-primary { stroke: #00d4aa; stroke-width: 3; fill: none; marker-end: url(#arrow-primary); }
      .arrow-secondary { stroke: #4a90e2; stroke-width: 2.5; fill: none; marker-end: url(#arrow-secondary); }
      .arrow-data { stroke: #6c5ce7; stroke-width: 2; fill: none; marker-end: url(#arrow-data); }

      /* Badges */
      .badge-recover { fill: #dc2626; }
      .badge-maintain { fill: #f59e0b; }
      .badge-train { fill: #10b981; }
      .badge-text { fill: #ffffff; font-family: -apple-system, system-ui, sans-serif; font-size: 11px; font-weight: 700; }

      /* Section labels */
      .section-label { fill: #1e293b; stroke: #00d4aa; stroke-width: 1.5; }
    </style>

    <!-- Arrow markers -->
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#00d4aa"/>
    </marker>
    <marker id="arrow-secondary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#4a90e2"/>
    </marker>
    <marker id="arrow-data" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2,5 z" fill="#6c5ce7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1600" height="2200"/>

  <!-- ========== HEADER ========== -->
  <text x="80" y="70" class="title-main">Health Metrics App — Complete Architecture</text>
  <text x="80" y="105" class="text-body">React Native · Apple HealthKit → Normalization → ClickHouse → Science-based Insights → Visualization</text>
  <line x1="80" y1="125" x2="1520" y2="125" stroke="#1e293b" stroke-width="2"/>

  <!-- ========== SECTION 1: DATA INGESTION ========== -->
  <rect class="section-label" x="80" y="160" width="200" height="36" rx="10" ry="10"/>
  <text x="180" y="185" text-anchor="middle" class="text-tag">① DATA INGESTION</text>

  <!-- Apple HealthKit -->
  <rect class="panel-primary" x="80" y="220" width="580" height="200" rx="16" ry="16"/>
  <text x="370" y="260" text-anchor="middle" class="title-section">Apple HealthKit (iOS)</text>
  <text x="370" y="285" text-anchor="middle" class="text-code">react-native-health v1.19.0</text>

  <text x="110" y="320" class="text-body" font-weight="600">📊 Available Metrics:</text>
  <text x="130" y="345" class="text-small">• HeartRate (BPM)</text>
  <text x="130" y="365" class="text-small">• HRV SDNN (ms)</text>
  <text x="130" y="385" class="text-small">• SpO₂ (%)</text>

  <text x="370" y="345" class="text-small">• Steps (count)</text>
  <text x="370" y="365" class="text-small">• Active Energy (kcal)</text>
  <text x="370" y="385" class="text-small">• Sleep Analysis 🚧</text>

  <!-- Google Fit Future -->
  <rect class="panel-future" x="700" y="220" width="320" height="200" rx="16" ry="16"/>
  <text x="860" y="260" text-anchor="middle" class="title-subsection" style="fill: #64748b;">Google Fit (Android)</text>
  <text x="860" y="285" text-anchor="middle" class="text-small" style="font-style: italic;">Not yet implemented</text>

  <text x="730" y="320" class="text-small">• Heart rate samples</text>
  <text x="730" y="340" class="text-small">• Activity tracking</text>
  <text x="730" y="360" class="text-small">• Sleep sessions</text>
  <text x="730" y="380" class="text-small">• OAuth authorization</text>

  <!-- Permissions -->
  <rect class="panel-muted" x="1060" y="220" width="460" height="200" rx="16" ry="16"/>
  <text x="1290" y="260" text-anchor="middle" class="title-subsection">Permissions &amp; Auto-Sync</text>
  <text x="1090" y="295" class="text-small">App.tsx:280-299</text>

  <text x="1090" y="325" class="text-body" font-weight="600">⏱️ Auto-Ingestion:</text>
  <text x="1110" y="350" class="text-small">• Foreground trigger (2-min interval)</text>
  <text x="1110" y="370" class="text-small">• Incremental sync</text>
  <text x="1110" y="390" class="text-small">• AsyncStorage checkpoints</text>

  <!-- Arrow down -->
  <path class="arrow-primary" d="M370 420 L370 490"/>
  <text x="390" y="460" class="text-accent">fetchSamples()</text>

  <!-- ========== SECTION 2: NORMALIZATION ========== -->
  <rect class="section-label" x="80" y="460" width="340" height="36" rx="10" ry="10"/>
  <text x="250" y="485" text-anchor="middle" class="text-tag">② NORMALIZATION &amp; DEDUPLICATION</text>

  <!-- Normalization -->
  <rect class="panel-secondary" x="80" y="520" width="520" height="220" rx="16" ry="16"/>
  <text x="340" y="560" text-anchor="middle" class="title-section">Data Normalizer</text>
  <text x="340" y="585" text-anchor="middle" class="text-code">/src/lib/ingestion/map.ts</text>

  <text x="110" y="620" class="text-body" font-weight="600">🔄 Transformations:</text>
  <rect fill="#0d1117" x="110" y="635" width="460" height="90" rx="8" ry="8"/>
  <text x="130" y="660" class="text-small">• Timestamp → UTC format</text>
  <text x="130" y="680" class="text-small">  "YYYY-MM-DD HH:mm:ss.mmm"</text>
  <text x="130" y="700" class="text-small">• SpO₂ scaling: 0-1 → percentage</text>
  <text x="130" y="720" class="text-small">• Extract day for partitioning</text>

  <!-- Deduplication -->
  <rect class="panel-secondary" x="640" y="520" width="520" height="220" rx="16" ry="16"/>
  <text x="900" y="560" text-anchor="middle" class="title-section">Deduplication Engine</text>
  <text x="900" y="585" text-anchor="middle" class="text-code">/src/lib/ingestion/queue.ts</text>

  <text x="670" y="620" class="text-body" font-weight="600">🔑 Composite Key Strategy:</text>
  <rect fill="#0d1117" x="670" y="635" width="460" height="90" rx="8" ry="8"/>
  <text x="690" y="660" class="text-small">"user_id|metric|ts|value|unit|</text>
  <text x="690" y="680" class="text-small"> source|device|day"</text>
  <text x="690" y="700" class="text-small">• In-memory Set tracking</text>
  <text x="690" y="720" class="text-small">• Exponential backoff: 2s→60s</text>

  <!-- Arrow down -->
  <path class="arrow-primary" d="M340 740 L340 810"/>
  <path class="arrow-primary" d="M900 740 L900 790 L800 790 L800 810"/>

  <!-- ========== SECTION 3: STORAGE ========== -->
  <rect class="section-label" x="80" y="780" width="240" height="36" rx="10" ry="10"/>
  <text x="200" y="805" text-anchor="middle" class="text-tag">③ BATCHING &amp; STORAGE</text>

  <!-- Batching -->
  <rect class="panel-tertiary" x="80" y="840" width="550" height="180" rx="16" ry="16"/>
  <text x="355" y="880" text-anchor="middle" class="title-section">HTTP Relay Client</text>
  <text x="355" y="905" text-anchor="middle" class="text-code">/src/lib/ingestion/client.ts</text>

  <text x="110" y="940" class="text-body" font-weight="600">📦 Batching Strategy:</text>
  <text x="130" y="965" class="text-small">• Chunk size: 200 rows/batch</text>
  <text x="130" y="985" class="text-small">• POST /metrics/insertRows</text>

  <text x="380" y="965" class="text-small">• Dev: 172.16.63.44:8787</text>
  <text x="380" y="985" class="text-small">• Prod: Configurable</text>

  <!-- ClickHouse Database (Cylinder) -->
  <g transform="translate(750, 840)">
    <ellipse cx="280" cy="45" rx="240" ry="40" class="db-main"/>
    <rect x="40" y="45" width="480" height="135" class="db-main"/>
    <ellipse cx="280" cy="180" rx="240" ry="40" class="db-main"/>
    <ellipse cx="280" cy="45" rx="240" ry="40" class="db-highlight"/>

    <text x="280" y="95" text-anchor="middle" class="title-section">ClickHouse Database</text>
    <text x="280" y="125" text-anchor="middle" class="text-code">myt_metrics.myt_metrics_raw</text>
    <text x="280" y="150" text-anchor="middle" class="text-small">Partitioned by day · Indexed by metric</text>
  </g>

  <!-- Arrow to DB -->
  <path class="arrow-primary" d="M630 930 L750 930"/>
  <text x="690" y="920" text-anchor="middle" class="text-accent">insert</text>

  <!-- Schema and Checkpoint -->
  <rect class="panel-muted" x="80" y="1060" width="720" height="120" rx="12" ry="12"/>
  <text x="110" y="1095" class="text-body" font-weight="600">📋 Schema (MetricRow):</text>
  <text x="130" y="1120" class="text-code">user_id | metric | ts (UTC) | value | unit</text>
  <text x="130" y="1145" class="text-code">source | device_id | day (YYYY-MM-DD)</text>

  <rect class="panel-muted" x="840" y="1060" width="360" height="120" rx="12" ry="12"/>
  <text x="1020" y="1095" text-anchor="middle" class="text-body" font-weight="600">💾 Local Checkpoint</text>
  <text x="870" y="1125" class="text-small">AsyncStorage tracking</text>
  <text x="870" y="1150" class="text-small">48-hour lookback fallback</text>

  <!-- Arrow down -->
  <path class="arrow-secondary" d="M1030 1020 L1030 1240"/>
  <text x="1050" y="1130" class="text-accent">query</text>

  <!-- ========== SECTION 4: CALCULATIONS ========== -->
  <rect class="section-label" x="80" y="1210" width="320" height="36" rx="10" ry="10"/>
  <text x="240" y="1235" text-anchor="middle" class="text-tag">④ SCIENCE-BASED CALCULATIONS</text>

  <!-- HRV Analysis -->
  <rect class="panel-tertiary" x="80" y="1270" width="460" height="260" rx="16" ry="16"/>
  <text x="310" y="1310" text-anchor="middle" class="title-section">HRV Analysis</text>
  <text x="310" y="1335" text-anchor="middle" class="text-code">/src/features/hrv/math.ts</text>

  <rect fill="#0d1117" x="110" y="1355" width="400" height="145" rx="8" ry="8"/>
  <text x="130" y="1380" class="text-body" font-weight="600">Algorithm:</text>
  <text x="150" y="1405" class="text-small">1. Daily median aggregation</text>
  <text x="150" y="1425" class="text-small">2. 28-day rolling baseline</text>
  <text x="150" y="1445" class="text-small">3. % change from baseline</text>

  <text x="130" y="1475" class="text-body" font-weight="600">Insights:</text>
  <text x="150" y="1495" class="text-small">≤-5%: RECOVER | -5 to +3%: MAINTAIN | ≥+3%: TRAIN</text>

  <!-- RHR Analysis -->
  <rect class="panel-tertiary" x="580" y="1270" width="460" height="260" rx="16" ry="16"/>
  <text x="810" y="1310" text-anchor="middle" class="title-section">Resting Heart Rate</text>
  <text x="810" y="1335" text-anchor="middle" class="text-code">/src/features/heart-rate/math.ts</text>

  <rect fill="#0d1117" x="610" y="1355" width="400" height="145" rx="8" ry="8"/>
  <text x="630" y="1380" class="text-body" font-weight="600">Algorithm:</text>
  <text x="650" y="1405" class="text-small">1. Filter 00:00-08:00 window</text>
  <text x="650" y="1425" class="text-small">2. 5-min rolling median</text>
  <text x="650" y="1445" class="text-small">3. 10th percentile RHR</text>

  <text x="630" y="1475" class="text-body" font-weight="600">Insights:</text>
  <text x="650" y="1495" class="text-small">≥+5% (2d): RECOVER | ≤-3%: TRAIN</text>

  <!-- Readiness Score -->
  <rect class="panel-tertiary" x="1080" y="1270" width="440" height="260" rx="16" ry="16"/>
  <text x="1300" y="1310" text-anchor="middle" class="title-section">Readiness Score</text>
  <text x="1300" y="1335" text-anchor="middle" class="text-code">/src/features/readiness/math.ts</text>

  <rect fill="#0d1117" x="1110" y="1355" width="380" height="145" rx="8" ry="8"/>
  <text x="1130" y="1380" class="text-body" font-weight="600">Multi-Factor (0-100):</text>
  <text x="1150" y="1405" class="text-small">• HRV: ±25 pts</text>
  <text x="1150" y="1425" class="text-small">• RHR: -20 to +10 pts</text>
  <text x="1150" y="1445" class="text-small">• Sleep/Efficiency: ±30 pts</text>

  <text x="1130" y="1475" class="text-body" font-weight="600">Formula: 50 + Σ(drivers)</text>
  <text x="1150" y="1495" class="text-small">&lt;40: RECOVER | 40-70: MAINTAIN | &gt;70: TRAIN</text>

  <!-- Sleep and Architecture -->
  <rect class="panel-future" x="80" y="1570" width="460" height="140" rx="16" ry="16"/>
  <text x="310" y="1610" text-anchor="middle" class="title-subsection" style="fill: #cbd5e0;">Sleep Analysis 🚧</text>
  <text x="310" y="1635" text-anchor="middle" class="text-code">/src/features/sleep/sample.ts</text>
  <text x="110" y="1665" class="text-small">• Stage distribution tracking</text>
  <text x="110" y="1685" class="text-small">• Sleep efficiency calculation</text>

  <rect class="panel-muted" x="580" y="1570" width="940" height="140" rx="16" ry="16"/>
  <text x="1050" y="1610" text-anchor="middle" class="title-subsection">Feature-Based Architecture</text>
  <text x="610" y="1645" class="text-small">Pattern: /src/features/{metric}/</text>
  <text x="630" y="1670" class="text-code">use{Metric}.ts · math.ts · insights.ts · {Metric}Square.tsx</text>
  <text x="630" y="1690" class="text-small">React Hook · Pure Functions · Badge Logic · UI Widget</text>

  <!-- Arrow down -->
  <path class="arrow-data" d="M800 1530 L800 1770"/>
  <text x="820" y="1650" class="text-accent">generate insights</text>

  <!-- ========== SECTION 5: VISUALIZATION ========== -->
  <rect class="section-label" x="80" y="1740" width="340" height="36" rx="10" ry="10"/>
  <text x="250" y="1765" text-anchor="middle" class="text-tag">⑤ INSIGHTS &amp; VISUALIZATION</text>

  <!-- Insights Generation -->
  <rect class="panel-primary" x="80" y="1800" width="640" height="280" rx="16" ry="16"/>
  <text x="400" y="1840" text-anchor="middle" class="title-section">Health Trend Insights</text>
  <text x="400" y="1865" text-anchor="middle" class="text-code">/src/features/*/insights.ts</text>

  <text x="110" y="1900" class="text-body" font-weight="600">🎯 Insight Generation:</text>
  <text x="130" y="1925" class="text-small">• Threshold-based (HRV, RHR % deviation)</text>
  <text x="130" y="1945" class="text-small">• Z-score statistical testing</text>
  <text x="130" y="1965" class="text-small">• Multi-day persistence validation</text>

  <text x="110" y="2000" class="text-body" font-weight="600">Badge States:</text>
  <g transform="translate(130, 2010)">
    <rect class="badge-recover" x="0" y="0" width="100" height="26" rx="6" ry="6"/>
    <text x="50" y="18" text-anchor="middle" class="badge-text">RECOVER</text>

    <rect class="badge-maintain" x="120" y="0" width="105" height="26" rx="6" ry="6"/>
    <text x="172" y="18" text-anchor="middle" class="badge-text">MAINTAIN</text>

    <rect class="badge-train" x="245" y="0" width="75" height="26" rx="6" ry="6"/>
    <text x="282" y="18" text-anchor="middle" class="badge-text">TRAIN</text>
  </g>

  <text x="110" y="2060" class="text-small">Science-based thresholds guide recovery and training decisions</text>

  <!-- React Native UI -->
  <rect class="panel-primary" x="760" y="1800" width="760" height="280" rx="16" ry="16"/>
  <text x="1140" y="1840" text-anchor="middle" class="title-section">React Native UI Components</text>

  <text x="790" y="1880" class="text-body" font-weight="600">📈 Chart Components:</text>
  <text x="810" y="1905" class="text-small">• react-native-gifted-charts (Line/Bar)</text>
  <text x="810" y="1925" class="text-small">• Custom SVG gradients</text>
  <text x="810" y="1945" class="text-small">• Real-time 30-min sparklines</text>
  <text x="810" y="1965" class="text-small">• 7D/30D/90D period toggles</text>
  <text x="810" y="1985" class="text-small">• Baseline overlay visualization</text>

  <text x="1090" y="1880" class="text-body" font-weight="600">🖼️ App Screens:</text>
  <text x="1110" y="1905" class="text-small">• Overview dashboard</text>
  <text x="1110" y="1925" class="text-small">• Per-metric detail views</text>
  <text x="1110" y="1945" class="text-small">• RedesignHome UI</text>
  <text x="1110" y="1965" class="text-small">• MyActivity tracking</text>
  <text x="1110" y="1985" class="text-small">• Actionable insight badges</text>

  <text x="790" y="2025" class="text-small" font-weight="600">Data Flow:</text>
  <text x="810" y="2050" class="text-small">Raw samples → Daily aggregates → Baseline comparison → Insights → Charts</text>

  <!-- Bottom Summary -->
  <rect class="panel-muted" x="80" y="2120" width="1440" height="50" rx="10" ry="10"/>
  <text x="800" y="2150" text-anchor="middle" class="text-body">
    Complete pipeline: HealthKit ingestion → UTC normalization → Dedupe → ClickHouse storage → Science-based calculations → Actionable insights → Beautiful visualizations
  </text>

</svg>