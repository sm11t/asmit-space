<svg viewBox="0 0 1200 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .background { fill: #0a0e1a; }
      .component-box { fill: #0f1419; stroke: #10b981; stroke-width: 2; }
      .highlight-box { fill: #1a1f2e; stroke: #ff7a00; stroke-width: 2; }
      .title-text { fill: #ffffff; font-family: 'Arial', sans-serif; font-size: 18px; font-weight: bold; }
      .subtitle-text { fill: #94a3b8; font-family: 'Arial', sans-serif; font-size: 14px; }
      .tech-text { fill: #64748b; font-family: 'Arial', sans-serif; font-size: 12px; }
      .badge { fill: #ff7a00; font-family: 'Arial', sans-serif; font-size: 20px; font-weight: bold; }
      .badge-circle { fill: #ff7a00; }
      .arrow { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-orange { stroke: #ff7a00; stroke-width: 2; fill: none; marker-end: url(#arrowhead-orange); }
      .section-title { fill: #10b981; font-family: 'Arial', sans-serif; font-size: 16px; font-weight: bold; }
      .flow-text { fill: #cbd5e1; font-family: 'Arial', sans-serif; font-size: 13px; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ff7a00" />
    </marker>
  </defs>

  <!-- Background -->
  <rect class="background" width="1200" height="1400" />

  <!-- Main Title -->
  <text x="600" y="40" class="title-text" text-anchor="middle" style="font-size: 24px;">VOXEL CCTV - Real-Time Person Detection &amp; Spatial Tracking</text>
  <text x="600" y="65" class="subtitle-text" text-anchor="middle" style="font-size: 13px;">Built for Voxel51 Hackathon | Computer Vision Pipeline Architecture</text>

  <!-- Section 1: Input Layer -->
  <circle class="badge-circle" cx="80" cy="110" r="18" />
  <text x="80" y="118" class="badge" text-anchor="middle">①</text>
  <text x="110" y="118" class="section-title">INPUT LAYER</text>

  <!-- Webcam Input -->
  <rect class="component-box" x="50" y="140" width="250" height="140" rx="8" />
  <text x="175" y="165" class="title-text" text-anchor="middle">Webcam Feed</text>
  <line x1="60" y1="175" x2="290" y2="175" stroke="#10b981" stroke-width="1" opacity="0.3" />
  <text x="175" y="195" class="subtitle-text" text-anchor="middle">Hardware Input</text>
  <text x="175" y="215" class="tech-text" text-anchor="middle">• cv2.VideoCapture(0)</text>
  <text x="175" y="235" class="tech-text" text-anchor="middle">• Real-time Frame Capture</text>
  <text x="175" y="255" class="tech-text" text-anchor="middle">• BGR Color Space</text>

  <!-- Known Faces Database -->
  <rect class="component-box" x="340" y="140" width="250" height="140" rx="8" />
  <text x="465" y="165" class="title-text" text-anchor="middle">Known Faces DB</text>
  <line x1="350" y1="175" x2="580" y2="175" stroke="#10b981" stroke-width="1" opacity="0.3" />
  <text x="465" y="195" class="subtitle-text" text-anchor="middle">Person Directory Structure</text>
  <text x="465" y="215" class="tech-text" text-anchor="middle">• /known_people/&lt;Name&gt;/</text>
  <text x="465" y="235" class="tech-text" text-anchor="middle">• Multi-image per person</text>
  <text x="465" y="255" class="tech-text" text-anchor="middle">• JPG/PNG formats</text>

  <!-- Floor Plan Asset -->
  <rect class="component-box" x="630" y="140" width="250" height="140" rx="8" />
  <text x="755" y="165" class="title-text" text-anchor="middle">Floor Plan Map</text>
  <line x1="640" y1="175" x2="870" y2="175" stroke="#10b981" stroke-width="1" opacity="0.3" />
  <text x="755" y="195" class="subtitle-text" text-anchor="middle">Spatial Reference</text>
  <text x="755" y="215" class="tech-text" text-anchor="middle">• 2D Room Layout (69.37 m²)</text>
  <text x="755" y="235" class="tech-text" text-anchor="middle">• 16 Gaming Stations</text>
  <text x="755" y="255" class="tech-text" text-anchor="middle">• PNG Overlay Image</text>

  <!-- Section 2: Detection Layer -->
  <circle class="badge-circle" cx="80" cy="330" r="18" />
  <text x="80" y="338" class="badge" text-anchor="middle">②</text>
  <text x="110" y="338" class="section-title">DETECTION LAYER</text>

  <!-- YOLO Detection -->
  <rect class="highlight-box" x="50" y="360" width="540" height="160" rx="8" />
  <text x="320" y="390" class="title-text" text-anchor="middle" style="fill: #ff7a00;">YOLOv8 Nano Object Detection</text>
  <line x1="60" y1="400" x2="580" y2="400" stroke="#ff7a00" stroke-width="1" opacity="0.3" />
  <text x="320" y="425" class="subtitle-text" text-anchor="middle">Real-time Person Detection (Class 0 - COCO Dataset)</text>
  <text x="100" y="455" class="tech-text">• Ultralytics YOLOv8n model</text>
  <text x="100" y="475" class="tech-text">• Bounding box extraction (x, y, w, h)</text>
  <text x="100" y="495" class="tech-text">• Confidence scoring &amp; filtering</text>
  <text x="360" y="455" class="tech-text">• Min box area threshold: 100px²</text>
  <text x="360" y="475" class="tech-text">• Frame-by-frame inference</text>
  <text x="360" y="495" class="tech-text">• Multi-person detection support</text>

  <!-- Section 3: Recognition Layer -->
  <circle class="badge-circle" cx="680" cy="330" r="18" />
  <text x="680" y="338" class="badge" text-anchor="middle">③</text>
  <text x="710" y="338" class="section-title">RECOGNITION LAYER</text>

  <!-- Facial Recognition -->
  <rect class="highlight-box" x="630" y="360" width="540" height="160" rx="8" />
  <text x="900" y="390" class="title-text" text-anchor="middle" style="fill: #ff7a00;">Facial Recognition Pipeline</text>
  <line x1="640" y1="400" x2="1160" y2="400" stroke="#ff7a00" stroke-width="1" opacity="0.3" />
  <text x="900" y="425" class="subtitle-text" text-anchor="middle">Identity Verification via Face Encoding Comparison</text>
  <text x="680" y="455" class="tech-text">• face_recognition library (dlib)</text>
  <text x="680" y="475" class="tech-text">• Face location detection in bounding box</text>
  <text x="680" y="495" class="tech-text">• 128-dimensional face encodings</text>
  <text x="960" y="455" class="tech-text">• Euclidean distance matching</text>
  <text x="960" y="475" class="tech-text">• Tolerance threshold: 0.6</text>
  <text x="960" y="495" class="tech-text">• Returns name or "Unknown"</text>

  <!-- Section 4: Processing & Output Layer -->
  <circle class="badge-circle" cx="80" cy="570" r="18" />
  <text x="80" y="578" class="badge" text-anchor="middle">④</text>
  <text x="110" y="578" class="section-title">PROCESSING &amp; OUTPUT LAYER</text>

  <!-- Distance Calculation -->
  <rect class="component-box" x="50" y="600" width="360" height="140" rx="8" />
  <text x="230" y="625" class="title-text" text-anchor="middle">Distance Estimation</text>
  <line x1="60" y1="635" x2="400" y2="635" stroke="#10b981" stroke-width="1" opacity="0.3" />
  <text x="230" y="655" class="subtitle-text" text-anchor="middle">Calibration-Based Depth Calculation</text>
  <text x="230" y="680" class="tech-text" text-anchor="middle">• Known distance: 2.0m at 25,000px² area</text>
  <text x="230" y="700" class="tech-text" text-anchor="middle">• Formula: d = √((2.0² × 25000) / box_area)</text>
  <text x="230" y="720" class="tech-text" text-anchor="middle">• NumPy mathematical operations</text>

  <!-- Coordinate Transformation -->
  <rect class="component-box" x="450" y="600" width="360" height="140" rx="8" />
  <text x="630" y="625" class="title-text" text-anchor="middle">Spatial Mapping</text>
  <line x1="460" y1="635" x2="800" y2="635" stroke="#10b981" stroke-width="1" opacity="0.3" />
  <text x="630" y="655" class="subtitle-text" text-anchor="middle">3D to 2D Coordinate Transformation</text>
  <text x="630" y="680" class="tech-text" text-anchor="middle">• Camera position: (760, 100) on map</text>
  <text x="630" y="700" class="tech-text" text-anchor="middle">• Rotation angle: 180° transformation</text>
  <text x="630" y="720" class="tech-text" text-anchor="middle">• Scale: 100 pixels = 1 meter</text>

  <!-- Visualization Output -->
  <rect class="component-box" x="850" y="600" width="320" height="140" rx="8" />
  <text x="1010" y="625" class="title-text" text-anchor="middle">Real-Time Display</text>
  <line x1="860" y1="635" x2="1160" y2="635" stroke="#10b981" stroke-width="1" opacity="0.3" />
  <text x="1010" y="655" class="subtitle-text" text-anchor="middle">OpenCV Visualization Windows</text>
  <text x="1010" y="680" class="tech-text" text-anchor="middle">• Camera feed with bounding boxes</text>
  <text x="1010" y="700" class="tech-text" text-anchor="middle">• 2D map with person markers</text>
  <text x="1010" y="720" class="tech-text" text-anchor="middle">• Collision-aware label rendering</text>

  <!-- Arrows - Input Layer to Detection -->
  <path class="arrow" d="M 175 280 L 175 320 L 320 320 L 320 360" />
  <path class="arrow" d="M 465 280 L 465 310 L 540 310 L 540 360" />

  <!-- Arrows - Detection to Recognition -->
  <path class="arrow-orange" d="M 590 440 L 630 440" />

  <!-- Arrows - Recognition to Processing -->
  <path class="arrow" d="M 230 520 L 230 600" />
  <path class="arrow" d="M 630 520 L 630 600" />
  <path class="arrow" d="M 900 520 L 900 560 L 1010 560 L 1010 600" />

  <!-- Arrows - Processing flow -->
  <path class="arrow" d="M 410 670 L 450 670" />
  <path class="arrow" d="M 810 670 L 850 670" />

  <!-- Arrow from Floor Plan to Visualization -->
  <path class="arrow" d="M 755 280 L 755 560 L 1010 560 L 1010 600" />

  <!-- End-to-End Data Flow Section -->
  <rect class="component-box" x="50" y="790" width="1120" height="220" rx="8" />
  <text x="600" y="820" class="title-text" text-anchor="middle" style="font-size: 20px;">End-to-End Data Flow</text>
  <line x1="60" y1="830" x2="1160" y2="830" stroke="#10b981" stroke-width="1" opacity="0.3" />

  <!-- Flow steps -->
  <text x="80" y="860" class="flow-text" font-weight="bold">1. Capture</text>
  <text x="80" y="880" class="tech-text">Webcam captures</text>
  <text x="80" y="895" class="tech-text">raw video frames</text>
  <text x="80" y="910" class="tech-text">at real-time FPS</text>

  <path class="arrow-orange" d="M 180 880 L 230 880" />

  <text x="250" y="860" class="flow-text" font-weight="bold">2. Detect</text>
  <text x="250" y="880" class="tech-text">YOLOv8 identifies</text>
  <text x="250" y="895" class="tech-text">person bounding</text>
  <text x="250" y="910" class="tech-text">boxes in frame</text>

  <path class="arrow-orange" d="M 350 880 L 400 880" />

  <text x="420" y="860" class="flow-text" font-weight="bold">3. Recognize</text>
  <text x="420" y="880" class="tech-text">Extract faces &amp;</text>
  <text x="420" y="895" class="tech-text">match encodings</text>
  <text x="420" y="910" class="tech-text">to known people</text>

  <path class="arrow-orange" d="M 530 880 L 580 880" />

  <text x="600" y="860" class="flow-text" font-weight="bold">4. Calculate</text>
  <text x="600" y="880" class="tech-text">Estimate distance</text>
  <text x="600" y="895" class="tech-text">from box area</text>
  <text x="600" y="910" class="tech-text">using calibration</text>

  <path class="arrow-orange" d="M 710 880 L 760 880" />

  <text x="780" y="860" class="flow-text" font-weight="bold">5. Transform</text>
  <text x="780" y="880" class="tech-text">Convert 3D coords</text>
  <text x="780" y="895" class="tech-text">to 2D map position</text>
  <text x="780" y="910" class="tech-text">with rotation/scale</text>

  <path class="arrow-orange" d="M 910 880 L 960 880" />

  <text x="980" y="860" class="flow-text" font-weight="bold">6. Visualize</text>
  <text x="980" y="880" class="tech-text">Render on camera</text>
  <text x="980" y="895" class="tech-text">feed + 2D floor plan</text>
  <text x="980" y="910" class="tech-text">with labels &amp; markers</text>

  <!-- Performance note -->
  <text x="600" y="945" class="tech-text" text-anchor="middle" style="font-style: italic;">⚡ All processing happens in real-time on each frame with minimal latency</text>

  <!-- Loop indicator -->
  <path class="arrow-orange" d="M 1100 890 Q 1140 890 1140 940 Q 1140 980 70 980 Q 30 980 30 920 L 30 890" />
  <text x="1130" y="970" class="tech-text" style="fill: #ff7a00;">Continuous</text>
  <text x="1130" y="985" class="tech-text" style="fill: #ff7a00;">Loop</text>

  <!-- Tech Stack Footer -->
  <rect class="component-box" x="50" y="1050" width="1120" height="120" rx="8" />
  <text x="600" y="1080" class="section-title" text-anchor="middle" style="font-size: 18px;">Technology Stack</text>
  <line x1="60" y1="1090" x2="1160" y2="1090" stroke="#10b981" stroke-width="1" opacity="0.3" />

  <text x="150" y="1120" class="subtitle-text" font-weight="bold">ML &amp; Computer Vision:</text>
  <text x="150" y="1140" class="tech-text">YOLOv8n (Ultralytics) • face_recognition • dlib</text>

  <text x="600" y="1120" class="subtitle-text" font-weight="bold">Image Processing:</text>
  <text x="600" y="1140" class="tech-text">OpenCV (cv2) • NumPy</text>

  <text x="950" y="1120" class="subtitle-text" font-weight="bold">Core Language:</text>
  <text x="950" y="1140" class="tech-text">Python 3.x</text>

  <!-- Deployment Note -->
  <text x="600" y="1210" class="tech-text" text-anchor="middle" style="font-style: italic; fill: #64748b;">Standalone Desktop Application • No External APIs • Local Processing Only</text>

  <!-- Hackathon Badge -->
  <rect x="480" y="1240" width="240" height="50" rx="25" fill="#ff7a00" opacity="0.2" stroke="#ff7a00" stroke-width="2" />
  <text x="600" y="1272" class="title-text" text-anchor="middle" style="fill: #ff7a00; font-size: 20px;">🏆 Voxel51 Hackathon</text>

</svg>